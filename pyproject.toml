[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-seo-auditor"
version = "0.1.5"
description = "MCP server for on-page SEO audits: titles, meta descriptions, canonicals, robots and JSON-LD, with bounded crawling. Local, read-only, stdio."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Stefan Petrovici"}]
readme = "README.md"
dependencies = []

[project.scripts]
mcp-seo-auditor = "mcp_seo_auditor.server:main"
mcp-seo-auditor-hosted = "mcp_seo_auditor.hosted:main"

[tool.setuptools.packages.find]
where = ["src"]
